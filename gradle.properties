# 1. JVM & Performance
# Increased memory for faster builds of 65 apps.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 2. AndroidX & Jetifier
# Essential for modern libraries. Keep Jetifier only if using very old libraries.
android.useAndroidX=true
android.enableJetifier=false

# 3. Build Optimizations (Modern Standards)
# Reduces R class size and prevents resource conflicts between your 65 apps.
android.nonTransitiveRClass=true

# 4. 16 KB & Modern APK Alignment
# Crucial for SDK 35/Android 15 compatibility.

# 5. Removed Deprecated/Redundant Flags
# The following were removed because they are now default or invalid:
# - android.uniquePackageNames (Now default)
# - android.newDsl (Old experimental flag)
# - android.builtInKotlin (Handled by Kotlin plugin)
# - android.enableAppCompileTimeRClass (Internalized)
# - android.defaults.buildfeatures.resvalues (Now handled in build.gradle)
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
