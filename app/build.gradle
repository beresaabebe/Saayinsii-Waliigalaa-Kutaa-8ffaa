plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.beckytech.saayinsiiwaliigalaakutaa8ffaa'
    compileSdk 36 // Targeting 35 is safer for 16 KB alignment in 2026

    defaultConfig {
        applicationId "com.beckytech.saayinsiiwaliigalaakutaa8ffaa"
        minSdk 24 // Recommended for better 16 KB support
        targetSdk 36
        versionCode 9
        versionName "1.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Ensure native libraries are uncompressed for 16 KB alignment
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    // STOIC FIX: Mandatory for 16 KB page size alignment
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // Modern AndroidX (16 KB Compatible)
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // --- PURE FACEBOOK AUDIENCE NETWORK (No Mediation) ---
    // Using the version that explicitly supports 16 KB page sizes
    implementation('com.facebook.android:audience-network-sdk:6.21.0') {
        exclude group: 'com.android.support'
        exclude group: 'com.google.android.gms', module: 'play-services-basement'
    }

    // Add a modern version of play-services-basement to avoid pulling in legacy support libraries
    implementation 'com.google.android.gms:play-services-basement:18.10.0'

    // Fix for Missing class com.facebook.infer.annotation.Nullsafe
    compileOnly 'com.facebook.infer.annotation:infer-annotation:0.18.0'

    // --- TRANSITIVE DEPENDENCY OVERRIDES (The "Safety Net") ---
    // Forces internal libraries used by FAN to stay 16 KB compliant
    implementation "androidx.sqlite:sqlite:2.6.2"
    implementation "androidx.work:work-runtime:2.11.2"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
}