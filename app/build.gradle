plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.beckytech.saayinsiiwaliigalaakutaa8ffaa'
    compileSdk 37

    defaultConfig {
        applicationId "com.beckytech.saayinsiiwaliigalaakutaa8ffaa"
        minSdk 24
        targetSdk 37
        versionCode 11
        versionName "1.7.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // Modern AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0' // Keeping 2.8.7 as 2.11 might not exist or be stable in some repos

    // Google Play Services Ads & Mediation
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.ads.mediation:facebook:6.21.0.3'
    implementation 'com.google.ads.mediation:unity:4.19.0.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-messaging'

    // Play Services Core for In-app updates & reviews
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:review:2.0.2'

    // 16 KB Page Size Compatibility overrides
    implementation "androidx.sqlite:sqlite:2.7.0"
    implementation "androidx.work:work-runtime:2.11.2"
    implementation 'com.google.android.gms:play-services-basement:18.10.0'

    // PDF Support & Image viewing
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Internal FAN fix
    compileOnly 'com.facebook.infer.annotation:infer-annotation:0.18.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}